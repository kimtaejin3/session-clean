[package]
name = "sclean"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Claude Code 세션을 프로젝트별로 확인하고 규칙 기반 추천으로 안전하게 정리하는 로컬 터미널 UI"
repository = "https://github.com/kimtaejin3/session-clean"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
dirs = "6.0.0"
libc = "0.2.189"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
libc = "0.2.189"
serde_json = "1.0.151"
tempfile = "3.27.0"

[[bin]]
name = "sclean"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
